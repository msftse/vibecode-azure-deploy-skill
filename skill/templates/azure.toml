# azure.toml. managed by deploy-azure (edits preserved)
#
# This file is the single source of truth for an agent or human running
# `deploy-azure up`. Re-running is always safe. See AGENTS.md in the repo
# root for the full agent contract.

[project]
name = "my-app"
region = "westeurope"
resource_group = "rg-my-app"

[backend]
path = "backend"
port = 8000
app_name = "ca-my-app"
acr_name = "myappacr"
profile = "flex"            # "express" | "flex" | "consumption"
cpu = 0.5                   # Flex requires one of the exact pairs (see docs/flex-vs-consumption.md)
memory = "2Gi"
min_replicas = 1            # Flex preview requires ≥ 1; express/consumption can use 0
max_replicas = 10

[frontend]
path = "frontend"
framework = "next"
swa_name = "swa-my-app"

[db]
kind = "postgres"
