name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Install deploy-azure skill
        run: |
          git clone --depth 1 https://github.com/your-org/hermes-skills.git ~/.hermes-skills || true
          chmod +x ~/.hermes-skills/devops/deploy-azure/scripts/deploy-azure || true
      - name: Deploy
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          ~/.hermes-skills/devops/deploy-azure/scripts/deploy-azure up --yes
